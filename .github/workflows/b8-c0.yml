name: B8 C0 Shell

# B8 C0 壳工程验证：推送到 b8-flutter-rewrite 或手动触发。
# 构建 4 个风味 release APK（含 Flutter module），上传 artifact 并记录包体积，
# 再把 4 个 APK + c0-sizes.txt 发布为 C0 专属 prerelease（tag b8-c0-<run>-<sha>），
# 每个 APK 单独一个附件、可直接下载。不碰 update-channel 清单与正式版 tag。
# 详见 docs/b8-c0-shell.md。现有 android-release.yml 未改动。

on:
  push:
    branches:
      - b8-flutter-rewrite
  workflow_dispatch:

permissions:
  # 创建 C0 专属 prerelease 需要写 contents（仅本 workflow）。
  contents: write

concurrency:
  group: b8-c0-shell
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  FLUTTER_VERSION: "3.50.0"

jobs:
  c0:
    name: Build C0 shell APKs
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与 android-release.yml 相同：四个大包连续打包会把 runner 磁盘吃满。
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h / | tail -1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        run: |
          # API 37 is not published in sdkmanager's stable channel; install the platform archive directly.
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;36.0.0"
          curl -fsSL -o /tmp/platform-37.zip https://dl.google.com/android/repository/platform-37.0_r01.zip
          rm -rf /tmp/platform-37 "$ANDROID_HOME/platforms/android-37"
          mkdir -p /tmp/platform-37 "$ANDROID_HOME/platforms"
          unzip -q /tmp/platform-37.zip -d /tmp/platform-37
          platform_jar="$(find /tmp/platform-37 -name android.jar -print -quit)"
          test -n "$platform_jar"
          mv "$(dirname "$platform_jar")" "$ANDROID_HOME/platforms/android-37"

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Expose Flutter SDK location
        run: |
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          test -x "$FLUTTER_ROOT/bin/flutter"
          echo "FLUTTER_ROOT=$FLUTTER_ROOT" >> "$GITHUB_ENV"
          echo "Flutter SDK at $FLUTTER_ROOT"
          flutter --version
          dart --version

      # 必须在 Gradle 配置之前：flutter pub get 生成 module 的 .android/
      # 包装工程（含 settings.gradle 引用的 include_flutter.groovy）。
      - name: Flutter pub get (generates module .android wrapper)
        run: |
          cd flutter_module
          flutter pub get
          test -f .android/include_flutter.groovy

      # 必须在 Gradle 编译之前：生成的 Dart 文件供 Flutter 编译，生成的
      # Java 文件供宿主编译。两边同一版本 Pigeon 一次生成。
      - name: Generate Pigeon bindings
        run: |
          cd flutter_module
          dart run pigeon --input pigeons/c0_messages.dart
          test -f lib/pigeon/c0_messages.g.dart
          test -f ../app/src/main/java/com/github/moyingshi/osc/tv/flutter/C0Messages.java

      # Fail fast：Dart 侧问题在这里暴露，而不是在 20+ 分钟的 Gradle 构建后。
      - name: Analyze Dart code (fail fast)
        run: |
          cd flutter_module
          flutter analyze

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          # 让 Flutter 的 Gradle hook 找到 SDK（与 FLUTTER_ROOT 环境变量双保险）。
          echo "flutter.sdk=$FLUTTER_ROOT" >> local.properties
          echo "Release signing configured"

      - name: Build four release APKs
        env:
          WEBHTV_RELEASE_TAG: b8-c0-${{ github.run_number }}
          WEBHTV_APK_SUFFIX: -b8-c0
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          ./gradlew \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      - name: Collect artifacts and record sizes
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          {
            echo "B8 C0 shell build"
            echo "commit: $GITHUB_SHA"
            echo "run: $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
            echo "flutter: $FLUTTER_VERSION"
            echo
            echo "APK sizes (bytes):"
            wc -c dist/*.apk
            echo
            echo "SHA-256:"
            sha256sum dist/*.apk
          } > dist/c0-sizes.txt
          ls -lh dist/
          cat dist/c0-sizes.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: b8-c0-${{ github.run_number }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      # C0 专属 prerelease：4 个 APK 各自一个附件、可直接下载，不用解 zip。
      # Tag 形态 b8-c0-<run>-<sha7> 与正式版 v…-beta-…/v…-… 均不重合，且始终
      # 标记 prerelease；不写 update-channel 清单，不影响应用内更新通道。
      # 构建重跑时 tag 已存在，改走 upload --clobber 覆盖附件。
      - name: Publish C0 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"
          TAG="b8-c0-${{ github.run_number }}-$SHORT_SHA"
          NOTES="B8 C0 shell test build. Commit $GITHUB_SHA. Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}. Phone install: mobile-arm64_v8a-b8-c0.apk."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/c0-sizes.txt --clobber
          else
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "B8 C0 shell build #${{ github.run_number }} ($SHORT_SHA)" \
              --notes "$NOTES" \
              --prerelease \
              dist/*.apk dist/c0-sizes.txt
          fi
