pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
        google()
        maven { url = "https://maven.aliyun.com/repository/gradle-plugin" }
        maven { url = "https://maven.aliyun.com/repository/public" }
    }
}

plugins {
    id "org.gradle.toolchains.foojay-resolver-convention" version "1.0.0"
}

dependencyResolutionManagement {
    // B8 C0: PREFER_SETTINGS, not FAIL_ON_PROJECT_REPOS. The Flutter Gradle
    // plugin (dev.flutter.flutter-gradle-plugin, applied by the generated
    // flutter_module/.android wrapper) adds its own maven repository, and
    // FAIL_ON_PROJECT_REPOS turns that into a configuration error. Under
    // PREFER_SETTINGS the plugin-added repository is ignored (Gradle warns)
    // and artifacts resolve from the central list below, which already
    // includes the Flutter storage repository. No project build file in
    // this repo declares repositories, so nothing else changes.
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    // B8 C0: Flutter engine artifacts repository, per the official add-to-app
    // project-setup doc. FLUTTER_STORAGE_BASE_URL supports mirror sites.
    String flutterStorageUrl = System.getenv('FLUTTER_STORAGE_BASE_URL') ?: 'https://storage.googleapis.com'
    repositories {
        maven { url = uri("$rootDir/third_party/maven") }
        mavenCentral()
        google()
        maven { url = "https://maven.aliyun.com/repository/public" }
        maven { url = "https://maven.aliyun.com/repository/google" }
        flatDir { dirs "$rootDir/app/libs" }
        maven { url = "https://jitpack.io" }
        maven { url = uri("$flutterStorageUrl/download.flutter.io") }
    }
}

include ':app'
include ':catvod'
include ':chaquo'
include ':nodejs'
include ':quickjs'
rootProject.name = "TV"

// B8 C0: Flutter module via the Gradle hook (add-to-app, module source code
// route). The official docs example assumes the module is a sibling of the
// host app; here it lives inside this repo, so the path is relative to
// settingsDir. `.android/include_flutter.groovy` is generated by
// `flutter pub get` in flutter_module/ and must exist before Gradle
// configures (CI runs pub get first). Without a Flutter SDK this build
// fails fast at configuration time; see docs/b8-c0-shell.md.
setBinding(new Binding([gradle: this]))
def flutterModuleHook = new File(settingsDir, 'flutter_module/.android/include_flutter.groovy')
apply from: flutterModuleHook
