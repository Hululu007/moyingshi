// ---- 模块打包（单元⑤）----
// 把 6 个模块的 .so/资产移出 APK 后，按 ABI 打成 module-<id>-<abi>-<versionCode>.zip，
// 再加一个总包 modules-all-<abi>-<versionCode>.zip（6 个分包 + total-manifest.json）。
// 分包 zip 根目录：manifest.json + 模块文件（平铺，文件名与 ModuleDefinition.files 一致）；
// 总包根目录：6 个分包 zip + total-manifest.json（{modules:[{file,module,size,sha256}]}，
// 总包本身不重复放 .so，只做分包的容器；校验以总清单内各分包 sha256 为准）。
// 确定性：ZipOutputStream 写固定时间戳（1980-01-01）+ 固定条目顺序（manifest 在首位，
// 其余按 ModuleDefinition.files / 模块表顺序）；manifest 内容不含时间戳。
// 产物：app/build/outputs/modules/<abi>/（CI 在此收集，随 release 一起发）。
// 文件清单与 ModuleDefinition.files 必须保持一致（改一处就要改另一处）；
// DV 的渲染器 .so 由 CMake 编出：mobile/leanback 两 variant 的产物可能因 DWARF 内嵌
// 路径不同而字节不同，这里按路径排序取首个，CI 只从 mobile 任务收集，故发布物唯一。
// 任务无 inputs/outputs 声明，每次 release assemble 都重新打（耗时数秒，可接受）。

def moduleAbis = ["arm64-v8a": "arm64_v8a", "armeabi-v7a": "armeabi_v7a"]

def moduleOrder = ["mpv", "vlc", "sherpa", "dovi", "ijk", "lut"]

def moduleUpstreamVersions = [
        mpv   : mpvSourceRevisions,
        vlc   : "libvlc-all 3.7.8",
        sherpa: "sherpa-onnx 1.13.4",
        dovi  : "exo-dv5-native",
        ijk   : "ijkplayer",
        lut   : "lut_presets",
]

// 文件名与 ModuleDefinition.files 逐项对应；顺序即 zip 内顺序。
def moduleFiles = [
        mpv   : ["libc++_shared.so", "libmvutil.so", "libmwresample.so", "libmwscale.so",
                 "libmvcodec.so", "libmvformat.so", "libmvfilter.so", "libmvdevice.so",
                 "libmpv.so", "libplayer.so"],
        vlc   : ["libc++_shared.so", "libvlc.so", "libvlcjni.so"],
        sherpa: ["libsherpa-onnx-jni.so"],
        dovi  : ["libdovi_android.so", "libexo_dovi_renderer.so"],
        ijk   : ["libijkffmpeg.so", "libijksdl.so", "libijkplayer.so"],
        lut   : ["低对比.cube", "复古深棕.cube", "徕卡胶片.cube", "明亮清新.cube",
                 "柔和中性.cube", "浪漫柔美.cube", "色彩还原.cube", "蓝绿带亮.cube",
                 "赛博朋克.cube", "通透鲜艳.cube", "钨丝灯.cube", "高级质感.cube"],
]

def sha256Hex = { File file ->
    def digest = java.security.MessageDigest.getInstance("SHA-256")
    file.withInputStream { stream ->
        byte[] buffer = new byte[65536]
        int n
        while ((n = stream.read(buffer)) != -1) digest.update(buffer, 0, n)
    }
    return digest.digest().encodeHex().toString()
}

def writeDeterministicZip = { File zipFile, List<Map> entries ->
    // entries: [{name: "manifest.json", file: File}, ...]，按列表顺序写，固定时间戳。
    zipFile.parentFile.mkdirs()
    new java.util.zip.ZipOutputStream(new java.io.FileOutputStream(zipFile)).withCloseable { zip ->
        entries.each { entry ->
            def zipEntry = new java.util.zip.ZipEntry(entry.name as String)
            zipEntry.time = 315532800000L // 1980-01-01T00:00:00Z（DOS 纪元）
            zip.putNextEntry(zipEntry)
            new java.io.FileInputStream(entry.file as File).withCloseable { input ->
                byte[] buffer = new byte[65536]
                int n
                while ((n = input.read(buffer)) != -1) zip.write(buffer, 0, n)
            }
            zip.closeEntry()
        }
    }
}

def extractAarJni = { File aarFile, String abi, File destDir, List<String> names ->
    new java.util.zip.ZipFile(aarFile).withCloseable { zip ->
        names.each { name ->
            def entry = zip.getEntry("jni/${abi}/${name}")
            if (entry == null) {
                throw new GradleException("AAR ${aarFile.name} 里没有 jni/${abi}/${name}")
            }
            def target = new File(destDir, name)
            target.parentFile.mkdirs()
            zip.getInputStream(entry).withCloseable { input ->
                new java.io.FileOutputStream(target).withCloseable { output ->
                    byte[] buffer = new byte[65536]
                    int n
                    while ((n = input.read(buffer)) != -1) output.write(buffer, 0, n)
                }
            }
        }
    }
}

def findCmakeDoviSo = { String abi, String flavor ->
    def flavorCap = flavor == "arm64_v8a" ? "Arm64_v8a" : "Armeabi_v7a"
    def buildDir = project.layout.buildDirectory.get().asFile
    // 1) CMake 原始产物（未 strip；AGP 文档口径 intermediates/cmake/<variant>/obj/<abi>/）。
    def cmakeMatches = project.fileTree("${buildDir}/intermediates/cmake") {
        include "**/obj/${abi}/libexo_dovi_renderer.so"
    }.files.sort { it.path }
    if (!cmakeMatches.isEmpty()) return cmakeMatches.first()
    // 2) 兜底：mergeNativeLibs 已合并的产物（同样未 strip；strip 产物在 stripped_native_libs 里）。
    //    首编 run 45625164694 实测：buildCMake 跑完、mergeNativeLibs 跑完后 intermediates/cmake 下仍无该 .so，
    //    故不能只认 CMake 原始目录；合并产物是同一份 .so 的逐字节拷贝，zip 内容不变。
    //    优先取 mobile variant（与 CI“只从 mobile 任务收集模块 zip”口径一致），其余 variant 仅作后备。
    def mergedMatches = project.fileTree("${buildDir}/intermediates/merged_native_libs") {
        include "**/out/lib/${abi}/libexo_dovi_renderer.so"
    }.files.sort { it.path }
    if (!mergedMatches.isEmpty()) {
        def mobile = mergedMatches.find { it.path.contains("/mobile${flavorCap}Release/") }
        return mobile != null ? mobile : mergedMatches.first()
    }
    throw new GradleException(
            "找不到 libexo_dovi_renderer.so（ABI ${abi}）：intermediates/cmake 下无 **/obj/${abi}/ 产物，" +
            "intermediates/merged_native_libs 下也无 **/out/lib/${abi}/ 产物；" +
            "请确认 CMake 构建（buildCMakeRelWithDebInfo[${abi}]）已产出该 .so")
}

def packageModulesAction = { String abi, String flavor ->
    def versionCode = android.defaultConfig.versionCode
    def buildDir = project.layout.buildDirectory.get().asFile
    def outDir = new File(buildDir, "outputs/modules/${abi}")
    outDir.mkdirs()
    def stageRoot = new File(buildDir, "modules-stage/${abi}")
    project.delete(stageRoot)
    stageRoot.mkdirs()

    // AAR 依赖：libvlc-all（VLC 的 3 个 .so，含 VLC 自带的 libc++_shared.so）与
    // exoplayerhdrutils（DV 的 libdovi_android.so）。VLC 不用基础包的 libc++_shared.so：
    // AAR 里那份（arm64 约 9.3MB）才是与 libvlc.so 同一套 NDK STL 构建的配对文件。
    def aarByName = [:]
    configurations.moduleAar.files.each { f -> aarByName[f.name] = f }
    def vlcAar = aarByName.find { k, v -> k.startsWith("libvlc-all-") }?.value
    def hdrAar = aarByName.find { k, v -> k.startsWith("exoplayerhdrutils-") }?.value
    if (vlcAar == null) throw new GradleException("moduleAar 里找不到 libvlc-all AAR")
    if (hdrAar == null) throw new GradleException("moduleAar 里找不到 exoplayerhdrutils AAR")
    def aarStage = new File(stageRoot, ".aar")
    extractAarJni(vlcAar, abi, new File(aarStage, "vlc"), moduleFiles["vlc"])
    extractAarJni(hdrAar, abi, new File(aarStage, "hdr"), ["libdovi_android.so"])

    def doviRenderer = findCmakeDoviSo(abi, flavor)

    def subZips = []
    moduleOrder.each { moduleId ->
        def names = moduleFiles[moduleId]
        def moduleStage = new File(stageRoot, moduleId)
        moduleStage.mkdirs()
        def fileInfos = []
        names.each { name ->
            File source
            switch (moduleId) {
                case "mpv":
                    source = new File(projectDir, "src/${flavor}/mpv-libs/${abi}/${name}")
                    break
                case "vlc":
                    source = new File(aarStage, "vlc/${name}")
                    break
                case "sherpa":
                case "ijk":
                    source = new File(projectDir, "src/main/jniLibs/${abi}/${name}")
                    break
                case "dovi":
                    source = name == "libexo_dovi_renderer.so"
                            ? doviRenderer : new File(aarStage, "hdr/${name}")
                    break
                case "lut":
                    source = new File(projectDir, "src/main/lut-presets/${name}")
                    break
                default:
                    source = null
            }
            if (source == null || !source.isFile()) {
                throw new GradleException("模块 ${moduleId} 缺少文件：${name}（ABI ${abi}）")
            }
            def target = new File(moduleStage, name)
            java.nio.file.Files.copy(source.toPath(), target.toPath())
            fileInfos << [name: name, size: target.length(), sha256: sha256Hex(target)]
        }
        def manifest = [
                module           : moduleId,
                moduleVersion    : versionCode.toString(),
                appVersionCodeMin: versionCode,
                appVersionCodeMax: versionCode,
                abi              : abi,
                upstreamVersion  : moduleUpstreamVersions[moduleId],
                files            : fileInfos,
        ]
        def manifestJson = new groovy.json.JsonBuilder(manifest).toPrettyString()
        java.nio.file.Files.write(new File(moduleStage, "manifest.json").toPath(),
                manifestJson.getBytes(java.nio.charset.StandardCharsets.UTF_8))
        def zipName = "module-${moduleId}-${abi}-${versionCode}.zip"
        def zipFile = new File(outDir, zipName)
        def entries = [[name: "manifest.json", file: new File(moduleStage, "manifest.json")]]
        names.each { n -> entries << [name: n, file: new File(moduleStage, n)] }
        writeDeterministicZip(zipFile, entries)
        subZips << [file: zipName, module: moduleId, size: zipFile.length(), sha256: sha256Hex(zipFile)]
        logger.lifecycle("模块分包：${zipFile} (${zipFile.length()} 字节)")
    }

    // 总包：6 个分包 + total-manifest.json（只列分包，不重复放 .so）。
    def totalManifest = [modules: subZips]
    def totalJson = new groovy.json.JsonBuilder(totalManifest).toPrettyString()
    def totalStage = new File(stageRoot, "all")
    totalStage.mkdirs()
    java.nio.file.Files.write(new File(totalStage, "total-manifest.json").toPath(),
            totalJson.getBytes(java.nio.charset.StandardCharsets.UTF_8))
    def totalEntries = [[name: "total-manifest.json", file: new File(totalStage, "total-manifest.json")]]
    subZips.each { s -> totalEntries << [name: s.file, file: new File(outDir, s.file)] }
    def totalZip = new File(outDir, "modules-all-${abi}-${versionCode}.zip")
    writeDeterministicZip(totalZip, totalEntries)
    logger.lifecycle("模块总包：${totalZip} (${totalZip.length()} 字节)")
}

moduleAbis.each { abi, flavor ->
    def flavorCap = flavor == "arm64_v8a" ? "Arm64_v8a" : "Armeabi_v7a"
    tasks.register("packageModules${flavorCap}") {
        group = "build"
        description = "打包 ${abi} 的 6 个模块分包 + 总包（app/build/outputs/modules/${abi}/）"
        // DV 的渲染器 .so 由 CMake 编出。CI 实测任务名是 buildCMakeRelWithDebInfo[arm64-v8a]
        //（按 CMake 构建类型 + ABI 命名，不含 variant 名），旧的 contains(variantCap) 匹配不到任何任务，
        // 依赖是空操作。另等 mobile variant 的 mergeNativeLibs 完成，保证合并产物已落盘（兜底查找用）。
        dependsOn(tasks.matching { it.name.startsWith("buildCMake") && it.name.endsWith("[${abi}]") })
        dependsOn("mergeMobile${flavorCap}ReleaseNativeLibs")
        doLast {
            packageModulesAction(abi, flavor)
        }
    }
}

// release assemble 顺带产出该 ABI 的模块 zip（只在 release 任务上挂；debug 不打）。
tasks.matching { it.name ==~ /assemble(Mobile|Leanback)(Arm64_v8a|Armeabi_v7a)Release/ }.configureEach {
    def flavorCap = it.name.contains("Arm64_v8a") ? "Arm64_v8a" : "Armeabi_v7a"
    dependsOn("packageModules${flavorCap}")
}
