            }
        }
    }

    flavorDimensions = ["mode", "abi"]

    productFlavors {
        leanback {
            dimension "mode"
        }
        mobile {
            dimension "mode"
        }
        arm64_v8a {
            dimension "abi"
            ndk { abiFilters "arm64-v8a" }
        }
        armeabi_v7a {
            dimension "abi"
            ndk { abiFilters "armeabi-v7a" }
        }
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
        compose = true
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    // ASS rendering is part of normal builds; package the matching prebuilt ABI.
    sourceSets.main.jniLibs.srcDir(rootProject.file('third_party/exo-ass-native/prebuilt'))
    sourceSets.androidTest.assets.srcDir(files("$projectDir/schemas").files)

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(localProps['storeFile'])
                keyAlias localProps['keyAlias']
                keyPassword releaseKeyPassword
                storePassword localProps['storePassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = !fastRelease
            shrinkResources = !fastRelease
            signingConfig = hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-rules-media.pro'
        }
    }

    configurations.configureEach {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
        exclude group: 'com.android.support'
        resolutionStrategy {
            force libs.okhttp
            eachDependency { details ->
                if (details.requested.group == 'androidx.media3') {
                    details.useVersion(libs.versions.media3.get())
                    details.because('Use bundled Media3 build with MediaTitle and danmaku APIs')
                }
            }
        }
    }

    lint {
        disable 'UnsafeOptInUsageError'
        disable 'ExpiredTargetSdkVersion'
        checkReleaseBuilds = !fastRelease
    }

    // 模块化（单元⑤）：6 个模块的 .so 不再打进 APK，随模块 zip 分发。
    // 只排除了这 9 个文件（×2 ABI）：其余 .so（libexo_ass.so、FFmpeg、Chaquopy、Node 等）留在基础包。
    // 安全依据（2026-11-25 对 APK 内全部 .so 做 readelf DT_NEEDED 核查）：
    // libc++_shared.so 的唯一使用方是 libvlc.so（VLC 模块 zip 自带 AAR 里的那份并先预载），
    // libexo_ass.so 只依赖系统库，其余基础包 .so 不依赖任何一个被排除的文件。
    packaging {
        jniLibs {
            // addAll（而非 excludes +=）：AGP 的 excludes 只有 getter，Groovy 下 += 不可靠。
            excludes.addAll([
                    "lib/arm64-v8a/libsherpa-onnx-jni.so",
                    "lib/armeabi-v7a/libsherpa-onnx-jni.so",
                    "lib/arm64-v8a/libijkffmpeg.so",
                    "lib/armeabi-v7a/libijkffmpeg.so",
                    "lib/arm64-v8a/libijksdl.so",
                    "lib/armeabi-v7a/libijksdl.so",
                    "lib/arm64-v8a/libijkplayer.so",
                    "lib/armeabi-v7a/libijkplayer.so",
                    "lib/arm64-v8a/libc++_shared.so",
                    "lib/armeabi-v7a/libc++_shared.so",
                    "lib/arm64-v8a/libvlc.so",
                    "lib/armeabi-v7a/libvlc.so",
                    "lib/arm64-v8a/libvlcjni.so",
                    "lib/armeabi-v7a/libvlcjni.so",
                    "lib/arm64-v8a/libexo_dovi_renderer.so",
                    "lib/armeabi-v7a/libexo_dovi_renderer.so",
                    "lib/arm64-v8a/libdovi_android.so",
                    "lib/armeabi-v7a/libdovi_android.so",
            ])
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled = true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

